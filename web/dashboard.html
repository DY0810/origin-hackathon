<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FaultLine · Work queue</title>
<!-- Buyer dashboard (CLAUDE.md §6.7, design-system/MASTER.md §7.6). Serve with: python3 -m http.server -d web 8000 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5/dist/maplibre-gl.css">
<script defer src="https://cdn.jsdelivr.net/npm/maplibre-gl@5/dist/maplibre-gl.js"></script>
<style>
:root {
  --fl-canvas:#F4F3EF; --fl-surface:#FFFFFF; --fl-surface2:#ECEAE4;
  --fl-ink:#101318; --fl-ink2:#4A5361; --fl-ink3:#6B7483; --fl-stroke:#8A93A1;
  --fl-brand:#2350E6; --fl-on-brand:#FFFFFF; --fl-gold:#FFC233; --fl-gold-text:#8A5A00;
  --fl-success:#1B7F4B; --fl-warning:#A15C00; --fl-danger:#C8202F;
  --fl-sev1:#5B6878; --fl-sev2:#1F72C4; --fl-sev3:#9E6300; --fl-sev4:#C9480A; --fl-sev5:#C8202F; --fl-on-sev:#FFFFFF;
  --fl-r-sm:8px; --fl-r-md:12px; --fl-r-lg:20px;
  --fl-hair: color-mix(in srgb, var(--fl-ink) 8%, transparent);
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px;
  --t-cap:12px; --t-meta:14px; --t-body:16px; --t-title:20px; --t-display:28px;
  --num: ui-rounded, "SF Pro Rounded", -apple-system, system-ui, sans-serif;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) { :root {
  --fl-canvas:#0B0D10; --fl-surface:#171A1F; --fl-surface2:#22262D;
  --fl-ink:#F2F4F7; --fl-ink2:#A7B0BD; --fl-ink3:#838C99; --fl-stroke:#5D6673;
  --fl-brand:#6E8EFF; --fl-on-brand:#0B0D10; --fl-gold:#FFC940; --fl-gold-text:#FFD166;
  --fl-success:#4CC38A; --fl-warning:#F5B040; --fl-danger:#FF6B6B;
  --fl-sev1:#9AA6B6; --fl-sev2:#5AA9F0; --fl-sev3:#F0A62A; --fl-sev4:#FF8540; --fl-sev5:#FF5A64; --fl-on-sev:#0B0D10;
}}
* { box-sizing: border-box; }
body { margin: 0; background: var(--fl-canvas); color: var(--fl-ink); font-size: var(--t-meta); line-height: 1.45; }
h1, h2, h3, p { margin: 0; }
[hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.muted { color: var(--fl-ink2); }
.num { font-family: var(--num); font-variant-numeric: tabular-nums; }
.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
:focus-visible { outline: 2px solid var(--fl-brand); outline-offset: 2px; }

button, select, textarea, input { font: inherit; color: inherit; }
button { cursor: pointer; }
.primary { background: var(--fl-brand); color: var(--fl-on-brand); border: 0; border-radius: var(--fl-r-md);
  min-height: 44px; padding: 0 var(--s4); font-size: var(--t-body); font-weight: 600; transition: filter .15s, transform .15s; }
.primary:hover { filter: brightness(1.08); }
.primary:active { transform: scale(.98); }
.primary:disabled { opacity: .5; cursor: progress; filter: none; transform: none; }
.ghost { background: transparent; border: 1px solid var(--fl-stroke); border-radius: var(--fl-r-md); min-height: 36px; padding: 0 var(--s3); font-weight: 600; }
.ghost:hover, .icon-btn:hover { background: var(--fl-surface2); }
.icon-btn { display: inline-grid; place-items: center; width: 36px; height: 36px; border: 0; border-radius: var(--fl-r-md); background: transparent; color: var(--fl-ink2); }
.icon-btn:disabled .i { animation: spin 1s linear infinite; }
.link { background: none; border: 0; padding: 0; color: var(--fl-brand); font-weight: 600; }
a { color: var(--fl-brand); font-weight: 600; text-decoration: none; }
a:hover { text-decoration: underline; }
select, textarea, input { background: var(--fl-surface); border: 1px solid var(--fl-stroke); border-radius: var(--fl-r-sm); }
select { min-height: 36px; padding: 0 var(--s2); font-size: var(--t-meta); width: 100%; }
@media (pointer: coarse) { .ghost, select, .icon-btn { min-height: 44px; min-width: 44px; } }

/* Severity badge: color + icon + numeral (MASTER §1.5) */
.sev { display: inline-flex; align-items: center; gap: 3px; height: 24px; padding: 0 8px 0 6px; border-radius: 999px;
  background: var(--c); color: var(--fl-on-sev); font: 700 var(--t-meta)/1 var(--num); font-variant-numeric: tabular-nums; flex: none; }
.sev .i { width: 14px; height: 14px; stroke-width: 2.4; }

/* Sign in */
.login { min-height: 100dvh; display: grid; place-items: center; padding: var(--s4); }
.login-card { width: min(400px, 100%); display: grid; gap: var(--s3); padding: var(--s6); background: var(--fl-surface);
  border: 1px solid var(--fl-hair); border-radius: var(--fl-r-lg); }
.login-card h1 { font: 700 var(--t-display)/1.15 var(--num); margin-top: var(--s4); }
.login-card p.muted { margin-bottom: var(--s3); }
.login-card label { font-weight: 600; }
.login-card input { min-height: 44px; padding: 0 var(--s3); font-size: var(--t-body); border-radius: var(--fl-r-md); }
.field-error { color: var(--fl-danger); min-height: 1.45em; }
.brand { display: flex; align-items: center; gap: var(--s2); font: 700 var(--t-title)/1 var(--num); letter-spacing: -.01em; }
.mark { width: 26px; height: 26px; fill: none; stroke: var(--fl-brand); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }

/* Shell */
.app { display: grid; grid-template-rows: auto minmax(0, 1fr); height: 100dvh; }
.top { display: flex; align-items: center; gap: var(--s4); padding: var(--s2) var(--s4) var(--s2) var(--s5);
  background: var(--fl-surface); border-bottom: 1px solid var(--fl-hair); }
.crumb { font-size: var(--t-body); font-weight: 500; color: var(--fl-ink2); padding-left: var(--s4); border-left: 1px solid var(--fl-hair); }
.sync { margin-left: auto; display: flex; align-items: center; gap: var(--s2); color: var(--fl-ink2); }
.sync .ghost { white-space: nowrap; }
.board { display: grid; min-height: 0; grid-template-columns: minmax(320px, 400px) minmax(0, 1fr) minmax(340px, 420px);
  grid-template-areas: "queue map detail"; }

/* Queue */
.queue { grid-area: queue; display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--fl-hair); }
.filters { display: grid; gap: var(--s3); padding: var(--s4); border-bottom: 1px solid var(--fl-hair); }
.seg { display: flex; margin: 0; padding: 3px; border: 0; border-radius: var(--fl-r-md); background: var(--fl-surface2); }
.seg label { flex: 1; position: relative; }
.seg input { position: absolute; inset: 0; margin: 0; opacity: 0; cursor: pointer; }
.seg span { display: flex; justify-content: center; align-items: center; gap: 6px; min-height: 32px; border-radius: 9px; font-weight: 600; color: var(--fl-ink2); }
.seg b { font: 600 var(--t-meta) var(--num); font-variant-numeric: tabular-nums; color: var(--fl-ink3); }
.seg input:checked + span { background: var(--fl-surface); color: var(--fl-ink); box-shadow: 0 0 0 1px var(--fl-hair); }
.seg input:focus-visible + span { outline: 2px solid var(--fl-brand); }
.selects { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s2); }
.selects label { display: grid; gap: var(--s1); font-size: var(--t-cap); font-weight: 600; color: var(--fl-ink2); }
.count { padding: var(--s3) var(--s4) 0; color: var(--fl-ink2); }
.count:empty { display: none; }
.banner { display: flex; align-items: center; gap: var(--s2); margin: var(--s3) var(--s4) 0; padding: var(--s2) var(--s3);
  border-radius: var(--fl-r-md); border: 1px solid color-mix(in srgb, var(--fl-warning) 40%, transparent);
  background: color-mix(in srgb, var(--fl-warning) 10%, var(--fl-surface)); }
.banner > .i { color: var(--fl-warning); }
.banner .link { margin-left: auto; }
.list { list-style: none; margin: 0; padding: var(--s2); overflow: auto; flex: 1; display: grid; align-content: start; gap: 2px; }
.item { display: grid; grid-template-columns: 2ch auto minmax(0, 1fr); gap: var(--s3); align-items: start; width: 100%;
  padding: var(--s3); border: 0; border-radius: var(--fl-r-md); background: transparent; text-align: left; }
.item:hover { background: var(--fl-surface2); }
.item[aria-current="true"] { background: var(--fl-surface); box-shadow: inset 0 0 0 1.5px var(--fl-brand); }
.item:focus-visible { outline-offset: -2px; }
.rank { font: 600 var(--t-meta)/24px var(--num); font-variant-numeric: tabular-nums; color: var(--fl-ink3); text-align: right; }
.item .title { display: block; font-size: var(--t-body); font-weight: 600; line-height: 1.3; }
.item .meta { display: block; color: var(--fl-ink2); }
.is-fixed .title { color: var(--fl-ink2); }
.tags { display: flex; flex-wrap: wrap; gap: var(--s1); margin-top: 6px; }
.tag { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; font-size: var(--t-cap); font-weight: 600;
  background: var(--fl-surface2); color: var(--fl-ink2); }
.tag .i { width: 12px; height: 12px; stroke-width: 2.5; }
.tag.danger { color: var(--fl-danger); background: color-mix(in srgb, var(--fl-danger) 12%, transparent); }
.tag.ok { color: var(--fl-success); background: color-mix(in srgb, var(--fl-success) 12%, transparent); }
.empty { padding: var(--s6) var(--s4); text-align: center; color: var(--fl-ink2); display: grid; gap: var(--s2); justify-items: center; }
.empty strong { color: var(--fl-ink); font-size: var(--t-body); }
.skel { display: grid; grid-template-columns: 2ch 40px 1fr; gap: var(--s3); padding: var(--s3); }
.skel span { height: 14px; border-radius: 7px; background: var(--fl-surface2); }
.skel span:nth-child(2) { height: 24px; border-radius: 999px; }
.skel span:nth-child(3) { width: 70%; }

/* Map */
.map-wrap { grid-area: map; position: relative; min-height: 0; }
#map { position: absolute; inset: 0; }
.legend { position: absolute; left: var(--s3); bottom: var(--s3); padding: var(--s2) var(--s3); border-radius: var(--fl-r-md);
  background: color-mix(in srgb, var(--fl-surface) 88%, transparent); backdrop-filter: blur(12px); box-shadow: 0 4px 12px rgb(0 0 0 / .15); font-size: var(--t-cap); }
.legend p { font-weight: 600; color: var(--fl-ink2); margin-bottom: var(--s1); }
.legend ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.legend li { display: flex; align-items: center; gap: var(--s2); }
.legend .sev { height: 20px; font-size: var(--t-cap); padding: 0 7px 0 5px; }
.legend .dot { width: 12px; height: 12px; margin: 0 6px; border-radius: 50%; background: var(--fl-success); }
.legend .area { width: 14px; height: 12px; margin: 0 5px; border-radius: 3px; border: 1.5px solid var(--fl-gold-text);
  background: color-mix(in srgb, var(--fl-gold) 30%, transparent); }
.legend .area.surge { border: 1.5px dashed var(--fl-danger); background: color-mix(in srgb, var(--fl-danger) 20%, transparent); }
.maplibregl-popup-content { background: var(--fl-surface); color: var(--fl-ink); border-radius: var(--fl-r-md); padding: var(--s3) var(--s4);
  display: grid; gap: var(--s2); font-size: var(--t-meta); }
.maplibregl-popup-tip { border-top-color: var(--fl-surface) !important; border-bottom-color: var(--fl-surface) !important; }
.maplibregl-popup-content strong { font-size: var(--t-body); padding-right: var(--s4); }
.maplibregl-popup-close-button { width: 32px; height: 32px; font-size: var(--t-title); color: var(--fl-ink2); }
.draw { position: absolute; top: var(--s3); left: var(--s3); z-index: 2; width: min(300px, calc(100% - 2 * var(--s3)));
  max-height: calc(100% - 2 * var(--s3)); overflow: auto;
  display: grid; gap: var(--s3); padding: var(--s4); border-radius: var(--fl-r-lg); background: var(--fl-surface); box-shadow: 0 4px 12px rgb(0 0 0 / .15); }
.draw h2 { font: 700 var(--t-title)/1.2 var(--num); }
.draw label { display: grid; gap: var(--s1); font-weight: 600; }
.draw label.check { display: flex; align-items: center; gap: var(--s2); }
.draw label.check input { width: 18px; min-height: 18px; margin: 0; accent-color: var(--fl-danger); }
.draw input { min-height: 36px; padding: 0 var(--s2); }
.draw .row { display: flex; flex-wrap: wrap; gap: var(--s2); }
.draw .row > * { flex: 1; }
.draw .field-error { min-height: 0; }
.drawing #map canvas { cursor: crosshair; }
.draw label .muted { font-weight: 400; }
.draw .row > label { min-width: 0; }
.draw .row input { width: 100%; }
.legend .area.danger { border: 1.5px solid var(--fl-danger); background: color-mix(in srgb, var(--fl-danger) 45%, transparent); }
.legend .store { width: 12px; height: 12px; margin: 0 6px; border-radius: 50%; background: var(--fl-brand); border: 2px solid var(--fl-surface); }
.stats { display: grid; grid-template-columns: auto auto; gap: 2px var(--s3); margin: 0; }
.stats dt { color: var(--fl-ink2); }
.stats dd { margin: 0; text-align: right; font-family: var(--num); font-variant-numeric: tabular-nums; }
.redeem { display: flex; gap: var(--s2); }
.redeem input { flex: 1; min-width: 0; min-height: 36px; padding: 0 var(--s2); text-transform: uppercase; font-family: var(--num); }

/* Detail */
.detail { grid-area: detail; display: flex; flex-direction: column; min-height: 0; overflow: auto; background: var(--fl-surface); border-left: 1px solid var(--fl-hair); }
.d-body { display: grid; gap: var(--s5); padding: var(--s5); }
.eyebrow { font: 600 var(--t-cap)/1 var(--num); letter-spacing: .05em; text-transform: uppercase; color: var(--fl-ink3); }
.d-head h2 { font: 700 var(--t-display)/1.15 var(--num); margin: var(--s2) 0 var(--s3); outline: none; }
.d-badges { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s2); }
.d-badges .tags { margin: 0; }
.photo { margin: 0; aspect-ratio: 4 / 3; border-radius: var(--fl-r-lg); overflow: hidden; background: var(--fl-surface2); }
.photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.no-photo { display: flex; align-items: center; gap: var(--s2); padding: var(--s3); border-radius: var(--fl-r-md); background: var(--fl-surface2); color: var(--fl-ink2); }
.block h3 { font-size: var(--t-cap); font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--fl-ink3); margin-bottom: var(--s2); }
.block p { font-size: var(--t-body); max-width: 65ch; }
.facts { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: var(--s2) var(--s4); margin: 0; }
.facts div { display: contents; }
.facts dt { color: var(--fl-ink2); }
.facts dd { margin: 0; }
.facts a { display: inline-flex; align-items: center; gap: 4px; }
.facts a .i { width: 13px; height: 13px; }
.factors { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--s2); }
.factors li { display: flex; align-items: center; gap: var(--s2); }
.factors li > .i { color: var(--fl-ink2); margin: 0 4px; }
.factors li > .danger { color: var(--fl-danger); }
.fixed-block { display: flex; gap: var(--s3); padding: var(--s4); border-radius: var(--fl-r-md); background: color-mix(in srgb, var(--fl-success) 10%, var(--fl-surface)); }
.fixed-block > .i { color: var(--fl-success); width: 20px; height: 20px; }
.fixed-block strong { display: block; font-size: var(--t-body); }
.fixed-block p { margin-top: var(--s2); }
.fix { position: sticky; bottom: 0; margin-top: auto; display: grid; gap: var(--s2); padding: var(--s4) var(--s5) var(--s5);
  background: var(--fl-surface); border-top: 1px solid var(--fl-hair); }
.fix label { font-weight: 600; }
.fix label span { font-weight: 400; color: var(--fl-ink2); }
.fix textarea { min-height: 64px; padding: var(--s2) var(--s3); font-size: var(--t-body); border-radius: var(--fl-r-md); resize: vertical; }
.fix .hint { color: var(--fl-ink2); font-size: var(--t-cap); }
.d-empty { margin: auto; padding: var(--s6); max-width: 32ch; text-align: center; color: var(--fl-ink2); }
.back { display: none; }

.toast { position: fixed; left: 50%; bottom: var(--s5); z-index: 10; display: flex; align-items: center; gap: var(--s2);
  padding: var(--s3) var(--s4); border-radius: var(--fl-r-md); background: var(--fl-ink); color: var(--fl-canvas); font-weight: 600;
  opacity: 0; transform: translate(-50%, 8px); transition: opacity .2s, transform .25s cubic-bezier(.22, 1, .36, 1); pointer-events: none; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast:empty { display: none; }

@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse { 50% { opacity: .5; } }
@media (prefers-reduced-motion: no-preference) { .skel span { animation: pulse 1.4s ease-in-out infinite; } }
@media (prefers-reduced-motion: reduce) {
  .primary, .toast { transition: none; }
  .primary:active { transform: none; }
  .toast { transform: translate(-50%, 0); }
  .icon-btn:disabled .i { animation: none; }
}

@media (max-width: 1099px) {
  .board { grid-template-columns: minmax(300px, 380px) minmax(0, 1fr); grid-template-rows: 42% minmax(0, 1fr);
    grid-template-areas: "queue map" "queue detail"; }
  .detail { border-left: 0; border-top: 1px solid var(--fl-hair); }
  #updated { display: none; }  /* two demand buttons need the room */
  .legend { display: none; }
}
@media (max-width: 759px) {
  .app { height: auto; }
  .top { flex-wrap: wrap; padding: var(--s2) var(--s4); }
  .crumb { display: none; }
  .board { display: flex; flex-direction: column; }
  .map-wrap { order: -1; height: 40vh; }
  .queue { border-right: 0; }
  .list { overflow: visible; }
  .detail { overflow: visible; border-top: 1px solid var(--fl-hair); }
  .back { display: inline-flex; align-items: center; margin-bottom: var(--s3); }
  #updated, #post-bounty, #new-campaign, .draw { display: none; }
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="i-sev1" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></symbol>
  <symbol id="i-sev2" viewBox="0 0 24 24"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-sev3" viewBox="0 0 24 24"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></symbol>
  <symbol id="i-sev4" viewBox="0 0 24 24"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4M12 17h.01"/></symbol>
  <symbol id="i-sev5" viewBox="0 0 24 24"><path d="M7.86 2h8.28L22 7.86v8.28L16.14 22H7.86L2 16.14V7.86z"/><path d="M12 8v4M12 16h.01"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></symbol>
  <symbol id="i-camera" viewBox="0 0 24 24"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></symbol>
  <symbol id="i-external" viewBox="0 0 24 24"><path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></symbol>
  <symbol id="i-mark" viewBox="0 0 24 24"><path d="M2 13h5l2.5-5 4 9 2.5-5H22"/></symbol>
</defs></svg>

<main id="login" class="login" hidden>
  <form id="login-form" class="login-card">
    <div class="brand"><svg class="mark" aria-hidden="true"><use href="#i-mark"/></svg>FaultLine</div>
    <h1>Buyer work queue</h1>
    <p class="muted">Damage reports from the field, ranked by what to fix first.</p>
    <label for="pass">Passcode</label>
    <input id="pass" type="password" autocomplete="current-password" required aria-describedby="login-error">
    <p id="login-error" class="field-error" role="alert"></p>
    <button class="primary">Open work queue</button>
  </form>
</main>

<div id="app" class="app" hidden>
  <header class="top">
    <div class="brand"><svg class="mark" aria-hidden="true"><use href="#i-mark"/></svg>FaultLine</div>
    <h1 class="crumb">Work queue</h1>
    <div class="sync">
      <button id="post-bounty" class="ghost" aria-pressed="false" aria-controls="draw">Post bounty</button>
      <button id="new-campaign" class="ghost" aria-pressed="false" aria-controls="camp">New campaign</button>
      <span id="updated" class="num">Loading…</span>
      <button id="refresh" class="icon-btn" aria-label="Refresh now"><svg class="i" aria-hidden="true"><use href="#i-refresh"/></svg></button>
      <button id="signout" class="ghost">Sign out</button>
    </div>
  </header>
  <div class="board">
    <section class="queue" aria-labelledby="queue-title">
      <h2 id="queue-title" class="sr-only">Reports</h2>
      <form id="filters" class="filters">
        <fieldset class="seg">
          <legend class="sr-only">Show</legend>
          <label><input type="radio" name="show" value="open" checked><span>Open <b id="n-open">–</b></span></label>
          <label><input type="radio" name="show" value="fixed"><span>Fixed <b id="n-fixed">–</b></span></label>
          <label><input type="radio" name="show" value="all"><span>All <b id="n-all">–</b></span></label>
        </fieldset>
        <div class="selects">
          <label>Severity<select id="f-sev">
            <option value="0">All</option><option value="3">3+ Repair soon</option><option value="4">4+ Urgent</option><option value="5">5 Hazard</option>
          </select></label>
          <label>Type<select id="f-type"><option value="">All types</option></select></label>
          <label>Sort<select id="f-sort">
            <option value="priority">Priority</option><option value="severity">Severity</option><option value="newest">Newest</option>
          </select></label>
        </div>
      </form>
      <div id="banner" class="banner" hidden>
        <svg class="i" aria-hidden="true"><use href="#i-sev4"/></svg><span id="banner-text" role="alert"></span>
        <button id="retry" class="link">Try again</button>
      </div>
      <p id="count" class="count" aria-live="polite"></p>
      <ol id="list" class="list"></ol>
    </section>
    <div class="map-wrap">
      <div id="map" role="region" aria-label="Map of the reports in the list"></div>
      <div class="legend"><p>Severity</p><ul id="legend"></ul></div>
      <form id="draw" class="draw" aria-labelledby="draw-title" hidden>
        <h2 id="draw-title">New bounty</h2>
        <p id="draw-hint" class="muted" aria-live="polite"></p>
        <label>Name<input id="draw-name" required maxlength="80" placeholder="Zone B"></label>
        <label>Multiplier<select id="draw-mult">
          <option value="1.5">1.5×</option><option value="2" selected>2×</option><option value="3">3×</option><option value="5">5×</option>
        </select></label>
        <label>Budget <span class="muted">(points, 100 = $1; blank = no cap)</span><input id="draw-budget" type="number" min="100" step="100" placeholder="20000"></label>
        <label class="check"><input type="checkbox" id="draw-surge">Surge (disaster)</label>
        <label class="check" id="draw-danger-row" hidden><input type="checkbox" id="draw-danger">Danger core: the middle pays nothing</label>
        <div class="row">
          <button type="button" id="draw-center" class="ghost">Add point at center</button>
          <button type="button" id="draw-undo" class="ghost">Undo point</button>
        </div>
        <p id="draw-error" class="field-error" role="alert" hidden></p>
        <div class="row"><button id="draw-post" class="primary">Post</button><button type="button" id="draw-cancel" class="ghost">Cancel</button></div>
      </form>
      <!-- Sponsored campaign (CLAUDE.md §9.1): a brand pays per verified store visit. Place stores by clicking the map. -->
      <form id="camp" class="draw" aria-labelledby="camp-title" hidden>
        <h2 id="camp-title">New campaign</h2>
        <p id="camp-hint" class="muted" aria-live="polite"></p>
        <label>Sponsor<input id="camp-sponsor" required maxlength="80" placeholder="Corner Mart"></label>
        <label>Title<input id="camp-title-in" required maxlength="60" placeholder="Slushie Sweep"></label>
        <label>Offer at the till<input id="camp-offer" required maxlength="80" placeholder="Free small slushie"></label>
        <div class="row">
          <label>Per visit ($)<input id="camp-price" type="number" min="0.25" max="20" step="0.25" value="1.50" required></label>
          <label>Bonus points<input id="camp-bonus" type="number" min="0" max="1000" step="10" value="50" required></label>
        </div>
        <div class="row">
          <label>Max visits<input id="camp-max" type="number" min="1" max="100000" value="2000" required></label>
          <label>Days<input id="camp-days" type="number" min="1" max="90" value="14" required></label>
        </div>
        <label>Report radius<select id="camp-radius"><option value="150">150 m</option><option value="300" selected>300 m</option><option value="500">500 m</option></select></label>
        <p id="camp-cost" class="muted num" aria-live="polite"></p>
        <div class="row">
          <button type="button" id="camp-center" class="ghost">Add store at center</button>
          <button type="button" id="camp-undo" class="ghost">Undo store</button>
        </div>
        <p id="camp-error" class="field-error" role="alert" hidden></p>
        <div class="row"><button id="camp-post" class="primary">Launch</button><button type="button" id="camp-cancel" class="ghost">Cancel</button></div>
      </form>
    </div>
    <aside id="detail" class="detail" aria-label="Selected report"></aside>
  </div>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script type="module">
const API = "https://kiygfzzdaqabrggjnrmf.supabase.co/functions/v1/buyer";
const SEV = ["", "Cosmetic", "Monitor", "Repair soon", "Urgent", "Hazard"];
const CHECKED = { accepted: "Verified by AI", review: "Waiting for a person to review (the AI wasn't sure)", pending: "Still being checked" };
const $ = (id) => document.getElementById(id);
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)");
const dark = matchMedia("(prefers-color-scheme: dark)");
const narrow = matchMedia("(max-width: 759px)");
const f = { show: "open", sev: 0, type: "", sort: "priority" };
let token = sessionStorage.getItem("fl-buyer") || "";
let reports = null, dataKey = "", detailKey = "", selectedId = null, map, fitted = false, toastTimer;
let bounties = [], verts = null, popup; // verts: points of the bounty being drawn, null when not drawing
let campaigns = [], stores = null;      // stores: [lng, lat] of the campaign being placed, null when not placing
const money = (cents) => (cents / 100).toLocaleString([], { style: "currency", currency: "USD" });
const placing = () => verts || stores;  // either map-click mode swallows pin and area clicks

const label = (t) => t ? t[0].toUpperCase() + t.slice(1).replaceAll("_", " ") : "Damage";
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const icon = (id, cls = "") => `<svg class="i ${cls}" aria-hidden="true"><use href="#i-${id}"/></svg>`;
const when = (iso) => new Date(iso).toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
const ago = (iso) => {
  const m = (Date.now() - Date.parse(iso)) / 6e4;
  return m < 1 ? "just now" : m < 60 ? `${Math.floor(m)} min ago` : m < 1440 ? `${Math.floor(m / 60)} h ago` : `${Math.floor(m / 1440)} d ago`;
};
const sevBadge = (s) => s ? `<span class="sev" style="--c:var(--fl-sev${s})">${icon("sev" + s)}<span aria-hidden="true">${s}</span><span class="sr-only">Severity ${s} of 5</span></span>` : "";
// Signed photo URLs change every fetch and priority drifts with age, so neither alone should repaint the page.
const stable = (v) => JSON.stringify(v, (k, x) => k === "photo_url" || k === "priority" ? undefined : x);

async function api(method, body) {
  const res = await fetch(API, { method, headers: { "x-buyer-token": token, "content-type": "application/json" },
                                 body: body && JSON.stringify(body) });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw Object.assign(new Error(data.error || "Request failed"), { status: res.status });
  return data;
}

function accept(list, areas = [], camps = []) {
  reports = list; bounties = areas; campaigns = camps;
  map?.getSource("bounties")?.setData(bountyGeo());
  map?.getSource("danger")?.setData(dangerGeo());
  map?.getSource("stores")?.setData(storeGeo());
  $("updated").textContent = `Updated ${new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })}`;
  const key = JSON.stringify(list.map((r) => [r.id, r.priority, r.fixed_at, r.status]));
  if (key !== dataKey) { dataKey = key; render(); }
}

async function refresh() {
  $("refresh").disabled = true;
  try { const d = await api("GET"); accept(d.reports, d.bounties, d.campaigns); $("banner").hidden = true; }
  catch (e) {
    if (e.status === 401) return signOut("Your passcode stopped working. Enter it again.");
    $("banner-text").textContent = reports ? `Couldn't refresh. ${e.message}. Showing the last list.` : `Couldn't load reports. ${e.message}.`;
    $("banner").hidden = false;
    if (!reports) $("list").innerHTML = "";
  } finally { $("refresh").disabled = false; }
}

function visible() {
  const key = { priority: (r) => r.priority, severity: (r) => (r.severity ?? 0) * 1e3 + r.priority, newest: (r) => Date.parse(r.created_at) }[f.sort];
  return (reports ?? []).filter((r) => (f.show === "all" || (f.show === "fixed") === !!r.fixed_at)
      && (r.severity ?? 1) >= f.sev && (!f.type || r.primary_type === f.type))
    .sort((a, b) => (!!a.fixed_at - !!b.fixed_at) || key(b) - key(a));
}

function tags(r, detail = false) {
  const t = [r.immediate_danger && !r.fixed_at && `<span class="tag danger">${icon("sev4")}Immediate danger</span>`,
             r.in_surge && !r.fixed_at && `<span class="tag danger">Surge</span>`,
             r.status === "review" && `<span class="tag">In review</span>`,
             r.status === "pending" && `<span class="tag">Checking</span>`,
             r.fixed_at && !detail && `<span class="tag ok">${icon("check")}Fixed ${ago(r.fixed_at)}</span>`].filter(Boolean);
  return t.length ? `<span class="tags">${t.join("")}</span>` : "";
}

function render() {
  const all = reports ?? [], open = all.filter((r) => !r.fixed_at).length;
  $("n-open").textContent = open; $("n-fixed").textContent = all.length - open; $("n-all").textContent = all.length;
  const types = [...new Set(all.map((r) => r.primary_type).filter(Boolean))].sort();
  const opts = `<option value="">All types</option>` + types.map((t) => `<option value="${esc(t)}">${esc(label(t))}</option>`).join("");
  if ($("f-type").dataset.opts !== opts) { $("f-type").innerHTML = $("f-type").dataset.opts = opts; $("f-type").value = f.type; f.type = $("f-type").value; }

  const rows = visible(), filtered = f.sev > 0 || !!f.type;
  $("count").textContent = filtered ? `${rows.length} ${rows.length === 1 ? "report matches" : "reports match"} these filters` : "";
  if (!rows.some((r) => r.id === selectedId)) selectedId = rows.find((r) => !r.fixed_at)?.id ?? rows[0]?.id ?? null;

  const focusId = document.activeElement?.closest?.("#list [data-id]")?.dataset.id;
  $("list").innerHTML = rows.length ? rows.map((r, i) => `
    <li><button class="item${r.fixed_at ? " is-fixed" : ""}" data-id="${r.id}"${r.id === selectedId ? ' aria-current="true"' : ""}>
      <span class="rank" aria-hidden="true">${f.sort === "priority" && !r.fixed_at ? i + 1 : ""}</span>
      ${sevBadge(r.severity)}
      <span><span class="title">${esc(label(r.primary_type))}</span>
        <span class="meta">${r.severity ? `${SEV[r.severity]} · ` : ""}${ago(r.created_at)}</span>${tags(r)}</span>
    </button></li>`).join("") : emptyList(filtered);
  if (focusId) $("list").querySelector(`[data-id="${focusId}"]`)?.focus();
  renderDetail(rows, filtered);
  if (map?.getSource("reports")) { map.getSource("reports").setData(geojson(rows)); fit(rows); }
}

function emptyList(filtered) {
  const [title, body] = filtered ? ["Nothing matches these filters", ""]
    : f.show === "fixed" ? ["No fixed reports yet", "Reports you mark fixed show up here."]
    : ["No open reports", "New reports show up here within 30 seconds of being checked."];
  return `<li class="empty"><strong>${title}</strong>${body && `<span>${body}</span>`}${filtered ? `<button class="ghost" data-clear>Clear filters</button>` : ""}</li>`;
}

function renderDetail(rows, filtered) {
  const r = reports?.find((x) => x.id === selectedId);
  const openRows = rows.filter((x) => !x.fixed_at);
  const rank = r && !r.fixed_at && f.sort === "priority" ? `#${openRows.indexOf(r) + 1} of ${openRows.length} ${filtered ? "shown" : "open"}` : "";
  const key = stable([r, rank]);
  if (key === detailKey) return;
  const d = $("detail"), sameReport = d.dataset.id === (r?.id ?? "");
  const note = sameReport ? $("fix-note")?.value : "", focused = sameReport && document.activeElement?.id === "fix-note";
  detailKey = key; d.dataset.id = r?.id ?? "";
  d.innerHTML = !r ? `<p class="d-empty">${reports ? "Select a report to see its photo, what the AI saw and why it's ranked where it is." : "Loading reports…"}</p>` : `
    <div class="d-body">
      <div class="d-head">
        <button class="ghost back" data-back>Back to list</button>
        <p class="eyebrow">${rank || (r.fixed_at ? "Fixed report" : "Open report")}</p>
        <h2 id="d-title" tabindex="-1">${esc(label(r.primary_type))}</h2>
        <div class="d-badges">${sevBadge(r.severity)}<span>${SEV[r.severity ?? 0] ?? ""}</span>${tags(r, true)}</div>
      </div>
      ${r.fixed_at ? `<div class="fixed-block">${icon("check")}<div><strong>Fixed ${ago(r.fixed_at)}</strong>
        <span class="muted">${when(r.fixed_at)}</span>${r.fixed_note ? `<p>“${esc(r.fixed_note)}”</p>` : ""}</div></div>` : ""}
      ${r.photo_url ? `<figure class="photo"><img src="${esc(r.photo_url)}" alt="Photo of the reported ${esc(label(r.primary_type).toLowerCase())}"></figure>`
                    : `<p class="no-photo">${icon("camera")}No photo on file for this report</p>`}
      <dl class="facts">
        <div><dt>Reported</dt><dd>${when(r.created_at)} <span class="muted">(${ago(r.created_at)})</span></dd></div>
        <div><dt>Location</dt><dd><span class="num">${r.lat.toFixed(4)}, ${r.lng.toFixed(4)}</span><br>
          <a href="https://www.google.com/maps/search/?api=1&query=${r.lat},${r.lng}" target="_blank" rel="noopener">Open in Google Maps${icon("external")}</a></dd></div>
        <div><dt>Checked</dt><dd>${esc(CHECKED[r.status] ?? label(r.status))}</dd></div>
        ${also(r)}
      </dl>
      ${r.explanation ? `<section class="block"><h3>What the AI saw</h3><p>${esc(r.explanation)}</p></section>` : ""}
      ${r.note ? `<section class="block"><h3>Reporter's note</h3><p>“${esc(r.note)}”</p></section>` : ""}
      ${r.fixed_at ? "" : `<section class="block"><h3>Why it's ranked here</h3><ul class="factors">
        <li>${sevBadge(r.severity ?? 1)}${SEV[r.severity ?? 1]} severity sets the base</li>
        ${r.immediate_danger ? `<li>${icon("sev4", "danger")}Immediate danger doubles it</li>` : ""}
        ${r.in_surge ? `<li>${icon("sev5", "danger")}Inside a surge area doubles it</li>` : ""}
        <li>${icon("clock")}Reported ${ago(r.created_at)}; weight halves every 14 days</li></ul></section>`}
    </div>
    ${r.fixed_at ? "" : `<form id="fix" class="fix">
      <label for="fix-note">Repair note <span>(optional, the reporter sees it)</span></label>
      <textarea id="fix-note" rows="2" maxlength="280" placeholder="Patched Sep 26, crew 4"></textarea>
      <p id="fix-error" class="field-error" role="alert" hidden></p>
      <button class="primary">Mark fixed</button>
      <p class="hint">The reporter gets a notification and a fix bonus. This can't be undone.</p>
    </form>`}`;
  if (note) $("fix-note").value = note;
  if (focused) $("fix-note").focus();
}

function also(r) {
  const more = (r.damage_types ?? []).filter((t) => t && t !== r.primary_type).map(label);
  return more.length ? `<div><dt>Also seen</dt><dd>${esc(more.join(", "))}</dd></div>` : "";
}

function geojson(rows) {
  return { type: "FeatureCollection", features: rows.map((r) => ({
    type: "Feature", geometry: { type: "Point", coordinates: [r.lng, r.lat] },
    properties: { id: r.id, severity: r.severity ?? 1, fixed: !!r.fixed_at, selected: r.id === selectedId } })) };
}

function initMap() {
  map = new maplibregl.Map({ container: "map", style: basemap(), center: [-118.2856, 34.0205], zoom: 12, attributionControl: { compact: true } });
  map.addControl(new maplibregl.NavigationControl({ showCompass: false }));
  map.on("style.load", addLayers);
  map.on("click", "pins", (e) => placing() || select(e.features[0].properties.id, "map"));
  map.on("click", (e) => verts ? addVert([e.lngLat.lng, e.lngLat.lat]) : stores && addStore([e.lngLat.lng, e.lngLat.lat]));
  for (const layer of ["pins", "store-pts"]) {
    map.on("mouseenter", layer, () => placing() || (map.getCanvas().style.cursor = "pointer"));
    map.on("mouseleave", layer, () => map.getCanvas().style.cursor = "");
  }
  map.on("click", "bounty-fill", bountyPopup);
  map.on("click", "store-pts", storePopup);
  dark.addEventListener("change", () => map.setStyle(basemap()));
}
const basemap = () => `https://tiles.openfreemap.org/styles/${dark.matches ? "dark" : "positron"}`;

// Re-run on every style load so pin colors follow the theme.
function addLayers() {
  const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const sev = ["match", ["get", "severity"], 1, css("--fl-sev1"), 2, css("--fl-sev2"), 3, css("--fl-sev3"), 4, css("--fl-sev4"), css("--fl-sev5")];
  const order = ["case", ["get", "selected"], 2, ["get", "fixed"], 0, 1];
  const gold = css("--fl-gold"), brand = css("--fl-brand"), danger = css("--fl-danger");
  map.addSource("bounties", { type: "geojson", data: bountyGeo() });
  map.addLayer({ id: "bounty-fill", type: "fill", source: "bounties", paint: { "fill-color": ["case", ["get", "surge"], danger, gold], "fill-opacity": 0.25 } });
  map.addLayer({ id: "bounty-line", type: "line", source: "bounties", filter: ["!=", ["get", "surge"], true], paint: { "line-color": css("--fl-gold-text"), "line-width": 1.5 } });
  map.addLayer({ id: "surge-line", type: "line", source: "bounties", filter: ["==", ["get", "surge"], true], paint: { "line-color": danger, "line-width": 2, "line-dasharray": [3, 2] } });
  map.addSource("danger", { type: "geojson", data: dangerGeo() });  // surge danger cores: pay nothing (§6.8)
  map.addLayer({ id: "danger-fill", type: "fill", source: "danger", paint: { "fill-color": danger, "fill-opacity": 0.45 } });
  map.addLayer({ id: "danger-line", type: "line", source: "danger", paint: { "line-color": danger, "line-width": 2 } });
  map.addSource("reports", { type: "geojson", data: geojson(visible()) });
  map.addLayer({ id: "pins", type: "circle", source: "reports", layout: { "circle-sort-key": order }, paint: {
    "circle-radius": ["case", ["get", "selected"], 15, ["get", "fixed"], 6, 11],
    "circle-color": ["case", ["get", "fixed"], css("--fl-success"), sev],
    "circle-stroke-width": ["case", ["get", "selected"], 3, 2],
    "circle-stroke-color": ["case", ["get", "selected"], css("--fl-brand"), css("--fl-surface")] } });
  map.addLayer({ id: "pin-numbers", type: "symbol", source: "reports", filter: ["!", ["get", "fixed"]], layout: {
    "text-field": ["to-string", ["get", "severity"]], "text-font": ["Noto Sans Bold"], "text-size": 12, "symbol-sort-key": order,
    "text-allow-overlap": true, "text-ignore-placement": true }, paint: { "text-color": css("--fl-on-sev") } });
  map.addSource("draft", { type: "geojson", data: draftGeo() });
  map.addLayer({ id: "draft-fill", type: "fill", source: "draft", filter: ["==", ["geometry-type"], "Polygon"], paint: { "fill-color": brand, "fill-opacity": 0.15 } });
  map.addLayer({ id: "draft-line", type: "line", source: "draft", filter: ["!=", ["geometry-type"], "Point"], paint: { "line-color": brand, "line-width": 2, "line-dasharray": [2, 1] } });
  map.addLayer({ id: "draft-pts", type: "circle", source: "draft", filter: ["==", ["geometry-type"], "Point"], paint: {
    "circle-radius": 5, "circle-color": brand, "circle-stroke-width": 2, "circle-stroke-color": css("--fl-surface") } });
  // Sponsored stores: live campaigns, plus the ones being placed (hollow) while creating a campaign.
  map.addSource("stores", { type: "geojson", data: storeGeo() });
  map.addLayer({ id: "store-pts", type: "circle", source: "stores", paint: {
    "circle-radius": 8, "circle-color": ["case", ["get", "draft"], css("--fl-surface"), brand],
    "circle-stroke-width": ["case", ["get", "draft"], 3, 2], "circle-stroke-color": ["case", ["get", "draft"], brand, css("--fl-surface")] } });
  fit(visible());
}

function fit(rows) {
  if (fitted || !rows.length) return;
  fitted = true;
  const b = rows.reduce((b, r) => b.extend([r.lng, r.lat]), new maplibregl.LngLatBounds([rows[0].lng, rows[0].lat], [rows[0].lng, rows[0].lat]));
  map.fitBounds(b, { padding: 56, maxZoom: 15, animate: false });
}

function select(id, from) {
  selectedId = id; render();
  const r = reports.find((x) => x.id === id);
  if (from === "list" && r) map[reduceMotion.matches ? "jumpTo" : "easeTo"]({ center: [r.lng, r.lat], zoom: Math.max(map.getZoom(), 14) });
  const behavior = reduceMotion.matches ? "auto" : "smooth";
  if (from === "map") $("list").querySelector(`[data-id="${id}"]`)?.scrollIntoView({ block: "nearest", behavior });
  if (from === "list" && narrow.matches) { $("detail").scrollIntoView({ behavior }); $("d-title")?.focus({ preventScroll: true }); }
}

const bountyGeo = () => ({ type: "FeatureCollection", features: bounties.map((b) => ({ type: "Feature", geometry: b.area, properties: { id: b.id, surge: !!b.surge } })) });
const dangerGeo = () => ({ type: "FeatureCollection", features: bounties.filter((b) => b.danger_area).map((b) => ({ type: "Feature", geometry: b.danger_area, properties: { id: b.id } })) });
const storeGeo = () => ({ type: "FeatureCollection", features: [
  ...campaigns.filter((c) => c.live).flatMap((c) => (c.stores ?? []).map((s) => ({ type: "Feature", geometry: { type: "Point", coordinates: [s.lng, s.lat] }, properties: { campaign: c.id, store: s.id, draft: false } }))),
  ...(stores ?? []).map((p) => ({ type: "Feature", geometry: { type: "Point", coordinates: p }, properties: { draft: true } })),
] });

// Click a bounty area (not a pin or store, not while drawing): name, multiplier, budget, and End bounty.
function bountyPopup(e) {
  if (placing() || map.queryRenderedFeatures(e.point, { layers: ["pins", "store-pts"] }).length) return;
  const b = bounties.find((x) => x.id === e.features[0].properties.id);
  if (!b) return;
  popup?.remove();
  const budget = b.budget_points ? `<span class="muted num">${(b.spent_points ?? 0).toLocaleString()} of ${b.budget_points.toLocaleString()} points paid</span>` : "";
  popup = new maplibregl.Popup({ maxWidth: "260px" }).setLngLat(e.lngLat).setHTML(`<strong>${esc(b.name)}</strong>
    <span class="tags"><span class="tag num">${esc(b.multiplier)}× points</span>${b.surge ? `<span class="tag danger">Surge</span>` : ""}${b.danger_area ? `<span class="tag danger">Danger core</span>` : ""}</span>
    ${budget}
    <button type="button" class="ghost">End bounty</button>`).addTo(map);
  const btn = popup.getElement().querySelector("button");
  btn.addEventListener("click", async () => {
    btn.disabled = true; btn.textContent = "Ending…";
    try {
      await api("POST", { end_bounty: b.id });
      popup?.remove(); toast(`Ended “${b.name}”. Its quests close too.`);
      await refresh();
    } catch (x) {
      if (x.status === 401) return signOut("Your passcode stopped working. Enter it again.");
      btn.disabled = false; btn.textContent = `Couldn't end it. ${x.message}. Try again`;
    }
  });
}
function draftGeo() {
  const v = verts ?? [], feats = v.map((c) => ({ type: "Feature", geometry: { type: "Point", coordinates: c } }));
  if (v.length >= 2) feats.push({ type: "Feature", geometry: v.length >= 3 ? { type: "Polygon", coordinates: [[...v, v[0]]] } : { type: "LineString", coordinates: v } });
  return { type: "FeatureCollection", features: feats };
}

// Draw mode: click the map (or "Add point at center" from the keyboard) to drop vertices, then Post.
function drawn() {
  const n = verts?.length ?? 0;
  map.getSource("draft")?.setData(draftGeo());
  $("draw-hint").textContent = n ? `${n} point${n === 1 ? "" : "s"}${n < 3 ? `. Add ${3 - n} more to make an area.` : n >= 50 ? " (the maximum)." : "."}` : "Click the map to drop the corners of the area.";
  $("draw-post").disabled = n < 3; $("draw-undo").disabled = !n;
}
function addVert(c) { if (verts.length < 50) { verts.push(c); drawn(); } }
function startDraw() {
  if (stores) stopCampaign();
  popup?.remove(); verts = []; $("draw").hidden = false; $("draw-error").hidden = true; $("app").classList.add("drawing");
  $("post-bounty").setAttribute("aria-pressed", "true"); map.doubleClickZoom.disable(); drawn(); $("draw-name").focus();
}
function stopDraw() {
  verts = null; $("draw").hidden = true; $("app").classList.remove("drawing");
  $("post-bounty").setAttribute("aria-pressed", "false"); map.doubleClickZoom.enable(); drawn(); $("post-bounty").focus();
}

// Campaign mode: click the map (or "Add store at center") to place participating stores, then Launch.
function placed() {
  const n = stores?.length ?? 0;
  map.getSource("stores")?.setData(storeGeo());
  $("camp-hint").textContent = n ? `${n} store${n === 1 ? "" : "s"} placed${n >= 50 ? " (the maximum)" : ""}.` : "Click the map to place each participating store.";
  $("camp-post").disabled = !n; $("camp-undo").disabled = !n;
  const perVisit = Math.round(+$("camp-price").value * 100) + Math.ceil((+$("camp-bonus").value || 0) * 1.25);
  const max = +$("camp-max").value || 0;
  $("camp-cost").textContent = perVisit > 0 && max > 0 ? `${money(perVisit)} per verified visit · up to ${money(perVisit * max)}` : "";
}
function addStore(c) { if (stores.length < 50) { stores.push(c); placed(); } }
function startCampaign() {
  if (verts) stopDraw();
  popup?.remove(); stores = []; $("camp").hidden = false; $("camp-error").hidden = true; $("app").classList.add("drawing");
  $("new-campaign").setAttribute("aria-pressed", "true"); map.doubleClickZoom.disable(); placed(); $("camp-sponsor").focus();
}
function stopCampaign() {
  stores = null; $("camp").hidden = true; $("app").classList.remove("drawing");
  $("new-campaign").setAttribute("aria-pressed", "false"); map.doubleClickZoom.enable(); placed(); $("new-campaign").focus();
}

// Click a sponsored store: the campaign's billable numbers, the till's code check, and End campaign.
function storePopup(e) {
  if (placing()) return;
  const { campaign, store } = e.features[0].properties;
  const c = campaigns.find((x) => x.id === campaign), s = c?.stores.find((x) => x.id === store);
  if (!c || !s) return;
  popup?.remove();
  popup = new maplibregl.Popup({ maxWidth: "280px" }).setLngLat(e.lngLat).setHTML(`<strong>${esc(c.title)}</strong>
    <span class="muted">${esc(c.sponsor)} · ${esc(c.offer)}</span>
    <dl class="stats">
      <dt>This store</dt><dd>${esc(s.name)} · ${s.visits} visits</dd>
      <dt>Verified visits</dt><dd>${c.visits.toLocaleString()} of ${c.max_visits.toLocaleString()}</dd>
      <dt>Redeemed at till</dt><dd>${c.redeemed.toLocaleString()}</dd>
      <dt>Billed</dt><dd>${money(c.billed_cents)} (${money(c.visit_price_cents)} each)</dd>
      <dt>Ends</dt><dd>${when(c.ends_at)}</dd>
    </dl>
    <form class="redeem"><label class="sr-only" for="redeem-code">Code from the player's phone</label>
      <input id="redeem-code" maxlength="6" placeholder="Code at the till" autocomplete="off"><button class="ghost">Redeem</button></form>
    <p class="field-error" role="alert" hidden></p>
    <button type="button" class="ghost" data-end>End campaign</button>`).addTo(map);
  const el = popup.getElement(), err = el.querySelector(".field-error"), end = el.querySelector("[data-end]");
  el.querySelector("form").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const btn = ev.target.querySelector("button"), code = el.querySelector("#redeem-code").value.trim();
    btn.disabled = true; err.hidden = true;
    try {
      const r = await api("POST", { redeem_code: code });
      toast(r.already_redeemed ? `Code ${r.code} was already used at ${r.store}.` : `Valid: give them “${r.offer}”.`);
      popup?.remove(); await refresh();
    } catch (x) {
      if (x.status === 401) return signOut("Your passcode stopped working. Enter it again.");
      err.textContent = `${x.message}.`; err.hidden = false; btn.disabled = false;
    }
  });
  end.addEventListener("click", async () => {
    end.disabled = true; end.textContent = "Ending…";
    try {
      await api("POST", { end_campaign: c.id });
      popup?.remove(); toast(`Ended “${c.title}”. Its stores leave the app map.`);
      await refresh();
    } catch (x) {
      if (x.status === 401) return signOut("Your passcode stopped working. Enter it again.");
      end.disabled = false; end.textContent = `Couldn't end it. ${x.message}. Try again`;
    }
  });
}

function toast(msg) {
  clearTimeout(toastTimer);
  $("toast").innerHTML = `${icon("check")}${esc(msg)}`;
  requestAnimationFrame(() => $("toast").classList.add("show"));
  toastTimer = setTimeout(() => $("toast").classList.remove("show"), 4000);
}

function showApp() {
  $("login").hidden = true; $("app").hidden = false;
  if (!map) initMap();
}

function signOut(msg = "") {
  if (verts) stopDraw();
  if (stores) stopCampaign();
  popup?.remove();
  sessionStorage.removeItem("fl-buyer");
  token = ""; reports = null; dataKey = detailKey = ""; selectedId = null;
  $("app").hidden = true; $("login").hidden = false;
  $("login-error").textContent = msg; $("pass").value = ""; $("pass").focus();
}

$("login-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = e.target.querySelector("button"); btn.disabled = true; btn.textContent = "Checking…";
  token = $("pass").value.trim();
  try {
    const d = await api("GET");
    sessionStorage.setItem("fl-buyer", token);
    showApp(); accept(d.reports, d.bounties, d.campaigns);
  } catch (err) {
    $("login-error").textContent = err.status === 401 ? "That passcode didn't work. Check it and try again." : `Couldn't reach FaultLine. ${err.message}.`;
  } finally { btn.disabled = false; btn.textContent = "Open work queue"; }
});

$("filters").addEventListener("change", (e) => {
  const t = e.target;
  if (t.name === "show") f.show = t.value;
  else if (t.id === "f-sev") f.sev = +t.value;
  else if (t.id === "f-type") f.type = t.value;
  else if (t.id === "f-sort") f.sort = t.value;
  render();
});

$("list").addEventListener("click", (e) => {
  if (e.target.closest("[data-clear]")) { f.sev = 0; f.type = ""; $("f-sev").value = "0"; $("f-type").value = ""; render(); return; }
  const item = e.target.closest("[data-id]");
  if (item) select(item.dataset.id, "list");
});

$("detail").addEventListener("click", (e) => {
  if (!e.target.closest("[data-back]")) return;
  const item = $("list").querySelector(`[data-id="${selectedId}"]`);
  item?.scrollIntoView({ block: "center" }); item?.focus({ preventScroll: true });
});

$("detail").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = e.target.querySelector(".primary"), err = $("fix-error");
  btn.disabled = true; btn.textContent = "Marking fixed…"; err.hidden = true;
  try {
    const res = await api("POST", { report_id: selectedId, note: $("fix-note").value });
    toast(res.already_fixed ? "Someone already marked this fixed." : res.bonus ? `Marked fixed. The reporter earns ${res.bonus} points.` : "Marked fixed.");
    await refresh();
    $("d-title")?.focus();
  } catch (x) {
    err.textContent = `Couldn't mark it fixed. ${x.message}.`; err.hidden = false;
    btn.disabled = false; btn.textContent = "Mark fixed";
  }
});

$("post-bounty").addEventListener("click", () => verts ? stopDraw() : startDraw());
$("draw-cancel").addEventListener("click", stopDraw);
$("draw-surge").addEventListener("change", (e) => {
  if (e.target.checked) $("draw-mult").value = "5";
  $("draw-danger-row").hidden = !e.target.checked;
  if (!e.target.checked) $("draw-danger").checked = false;
});
$("draw-undo").addEventListener("click", () => { verts.pop(); drawn(); });
$("draw-center").addEventListener("click", () => { const c = map.getCenter(); addVert([c.lng, c.lat]); });
document.addEventListener("keydown", (e) => e.key === "Escape" && (verts ? stopDraw() : stores && stopCampaign()));
$("draw").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = $("draw-post"), err = $("draw-error"), name = $("draw-name").value.trim(), multiplier = +$("draw-mult").value, surge = $("draw-surge").checked;
  const budget_points = $("draw-budget").value ? Math.round(+$("draw-budget").value) : null, danger = surge && $("draw-danger").checked;
  btn.disabled = true; btn.textContent = "Posting…"; err.hidden = true;
  try {
    await api("POST", { bounty: { name, multiplier, surge, danger, budget_points, ring: verts } });
    toast(surge ? `Surge “${name}” is live at ${multiplier}× with a storm-sweep quest${danger ? " and a no-pay danger core" : ""}. Reports inside it jump the queue.`
                : `Posted “${name}” at ${multiplier}×. Reporters' maps heat up within 30 seconds.`);
    stopDraw(); $("draw-name").value = ""; $("draw-budget").value = ""; $("draw-surge").checked = false;
    $("draw-danger").checked = false; $("draw-danger-row").hidden = true;
    await refresh();
  } catch (x) {
    if (x.status === 401) return signOut("Your passcode stopped working. Enter it again.");
    err.textContent = `Couldn't post it. ${x.message}.`; err.hidden = false;
  } finally { btn.textContent = "Post"; btn.disabled = (verts?.length ?? 0) < 3; }
});
$("new-campaign").addEventListener("click", () => stores ? stopCampaign() : startCampaign());
$("camp-cancel").addEventListener("click", stopCampaign);
$("camp-undo").addEventListener("click", () => { stores.pop(); placed(); });
$("camp-center").addEventListener("click", () => { const c = map.getCenter(); addStore([c.lng, c.lat]); });
for (const id of ["camp-price", "camp-bonus", "camp-max"]) $(id).addEventListener("input", placed);
$("camp").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = $("camp-post"), err = $("camp-error"), title = $("camp-title-in").value.trim();
  const campaign = {
    sponsor: $("camp-sponsor").value.trim(), title, offer: $("camp-offer").value.trim(),
    price_per_visit_cents: Math.round(+$("camp-price").value * 100), bonus_points: Math.round(+$("camp-bonus").value),
    max_visits: Math.round(+$("camp-max").value), days: Math.round(+$("camp-days").value), radius_m: +$("camp-radius").value,
    stores: stores.map(([lng, lat], i) => ({ name: `${$("camp-sponsor").value.trim()} #${i + 1}`, lat, lng })),
  };
  btn.disabled = true; btn.textContent = "Launching…"; err.hidden = true;
  try {
    const r = await api("POST", { campaign });
    toast(`“${title}” is live at ${r.stores} store${r.stores === 1 ? "" : "s"}. ${money(r.price_per_visit_cents)} per verified visit.`);
    stopCampaign(); for (const id of ["camp-sponsor", "camp-title-in", "camp-offer"]) $(id).value = "";
    await refresh();
  } catch (x) {
    if (x.status === 401) return signOut("Your passcode stopped working. Enter it again.");
    err.textContent = `Couldn't launch it. ${x.message}.`; err.hidden = false;
  } finally { btn.textContent = "Launch"; btn.disabled = !(stores?.length); }
});
$("refresh").addEventListener("click", refresh);
$("retry").addEventListener("click", refresh);
$("signout").addEventListener("click", () => signOut());
$("legend").innerHTML = [5, 4, 3, 2, 1].map((s) => `<li>${sevBadge(s)}${SEV[s]}</li>`).join("") + `<li><span class="dot"></span>Fixed</li><li><span class="area"></span>Bounty area</li><li><span class="area surge"></span>Surge area</li><li><span class="area danger"></span>Danger core (pays 0)</li><li><span class="store"></span>Sponsored store</li>`;

if (token) {
  showApp();
  $("list").innerHTML = `<li class="sr-only">Loading reports</li>` + `<li class="skel" aria-hidden="true"><span></span><span></span><span></span></li>`.repeat(6);
  renderDetail([], false);
  refresh();
} else signOut();
setInterval(() => token && !document.hidden && refresh(), 30_000);
</script>
</body>
</html>
