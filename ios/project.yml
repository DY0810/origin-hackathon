# Source of truth for the Xcode project. After editing: `cd ios && xcodegen` (brew install xcodegen).
name: FaultLine
options:
  bundleIdPrefix: com.dy0810
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
packages:
  WhisperKit:  # on-device dictation (Whisper via Core ML); repo renamed from argmaxinc/WhisperKit
    url: https://github.com/argmaxinc/argmax-oss-swift
    from: 1.1.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""   # set your team in Xcode to run on a device
targets:
  FaultLine:
    type: application
    platform: iOS
    scheme:
      testTargets: [FaultLineTests]
    sources:
      - FaultLine
      - path: ../design-system/DesignSystem.swift   # single source of truth, referenced not copied
        group: DesignSystem
      - path: ../design-system/fonts   # Poppins TTFs (OFL), registered at launch by FLFont.register()
        type: folder
        buildPhase: resources
        optional: true
      - path: Whisper   # tiny.en model from ios/scripts/fetch_whisper.sh (gitignored); no mic button without it
        type: folder
        buildPhase: resources
        optional: true
    dependencies:
      - package: WhisperKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dy0810.faultline
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: FaultLine
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSCameraUsageDescription: "FaultLine uses the camera to photograph infrastructure damage you report."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "FaultLine uses your location to identify the building or asset you photograph and to show nearby bounties."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "FaultLine can turn what you say into the report note. Speech is transcribed on your iPhone and the audio is never uploaded."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "FaultLine can scan photos on your iPhone for infrastructure damage. Nothing uploads without your approval."
        INFOPLIST_KEY_PHPhotoLibraryPreventAutomaticLimitedAccessAlert: YES   # the scan screen offers "Add photos" itself
  FaultLineTests:
    type: bundle.unit-test
    platform: iOS
    sources: [FaultLineTests]
    dependencies:
      - target: FaultLine
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.dy0810.faultline.tests
